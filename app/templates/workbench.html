<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ name }}</title><link rel="stylesheet" href="/static/specimen.css"><link rel="stylesheet" href="/static/impression.css" media="print"><script src="/static/blend.js" type="module"></script></head>
<body><div class="station"><aside class="index"><a class="brand" href="/" aria-label="碎玻璃配载单首页"><span class="sample-mark" aria-hidden="true">料</span>再生玻璃料场</a><nav aria-label="配载工作区"><a href="#worksheet">实验双联</a><a href="#weighing">磅单采集</a><a href="#closure">签单凭证</a></nav><span class="index-foot">化验 / 出料</span></aside>
<div class="workspace"><header class="topbar"><div><p class="overline">玻璃回收 · 出料记录</p><h1>{{ name }}</h1></div><div class="controls"><label>数据来源 <select id="sample">{% for key,label in samples.items() %}<option value="{{ key }}" {% if key == 'dirty' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label class="import">导入批次<input id="import" type="file" accept=".json,application/json"></label></div></header>
<main><div class="batchline"><span id="batch">读入批次</span><span id="balance" class="quality-seal" role="status">正在折算</span></div><div class="kpis" id="metrics"></div>
<div class="grid" id="worksheet">
<section class="panel lab"><header class="panel__head"><div><p class="overline">化验联</p><h2>批料折干</h2></div><label>批料 <select id="lot"></select></label></header><div id="lot-summary"></div><div class="ledger" id="samples"></div></section>
<section class="panel loading"><header class="panel__head"><div><p class="overline">装车联</p><h2>目标配载</h2></div><label>车次 <select id="target"></select></label></header><div id="load-plan"></div><div class="ledger" id="allocation"></div></section>
<section class="panel" id="weighing"><header class="panel__head"><h2>磅单采集</h2><label>视图 <select id="ticket-view"><option value="issues">异常与重复</option><option value="all">采信明细</option></select></label></header><div class="ledger" id="tickets"></div></section>
<section class="panel" id="closure"><header class="panel__head"><h2>签单凭证</h2><span id="remainder"></span></header><form id="sign-form"><label>签单人 <input id="operator" maxlength="32" required placeholder="输入签单人"></label><button type="submit">保存签单</button></form><p id="receipt" role="status"></p><div id="actions" hidden><button id="verify" type="button">复算签单</button><a id="download">下载配载凭证</a></div></section>
</div></main><footer class="statusbar"><span>称重至克 · 载量以千克显示</span><a href="/docs">接口 · 规则 {{ version }}</a></footer></div></div></body></html>
